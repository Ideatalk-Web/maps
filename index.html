<!DOCTYPE html>
<html>
<head>
<title>Ideamaps</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}

.title {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    background: white;
    padding: 8px 15px;
    border-radius: 20px;
    box-shadow: 0 2px 8px #0005;
    font-weight: bold;
}

.search {
    position: absolute;
    top: 60px;
    left: 10px;
    z-index: 999;
}

.search input {
    padding: 10px;
    width: 180px;
    border-radius: 8px;
    border: 1px solid #999;
}

</style>

</head>

<body>

<div class="title">
Ideamaps
</div>

<div class="search">
<input id="searchBox" placeholder="Search place">
</div>

<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>

// Create map
const map = L.map('map').setView(
    [39.9334, 32.8597],
    6
);


// Street map
const street = L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19,
    attribution: '© OpenStreetMap'
}
);


// Satellite imagery
const satellite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    maxZoom: 19,
    attribution: 'Satellite © Esri'
}
);


const labels = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Reference_Overlay/MapServer/tile/{z}/{y}/{x}',
{
    maxZoom: 19,
    attribution: 'Labels © Esri'
});






// Start with hybrid
satellite.addTo(map);
labels.addTo(map);
//code for hybrid map
const hybrid = L.layerGroup([
    satellite,
    labels
]);


// Layer buttons
L.control.layers({
    "Street": street,
    "Satellite": satellite,
    "Hybrid": hybrid
}).addTo(map);



// GPS button
const locate = L.control({position:'bottomright'});

locate.onAdd = function(){

    const button = L.DomUtil.create('button');

    button.innerHTML = "📍";

    button.style.fontSize = "24px";
    button.style.padding = "8px";
    button.style.borderRadius = "10px";

    button.onclick = function(){

        map.locate({
            setView:true,
            maxZoom:16
        });

    };

    return button;

};

locate.addTo(map);


// GPS result
map.on('locationfound', function(e){

    L.marker(e.latlng)
    .addTo(map)
    .bindPopup("You are here")
    .openPopup();

});


// Search
document
.getElementById("searchBox")
.addEventListener("keydown", function(e){

if(e.key === "Enter"){

let query = this.value;


fetch(
"https://nominatim.openstreetmap.org/search?format=json&q="
+ encodeURIComponent(query)
)

.then(response => response.json())

.then(data => {

if(data.length > 0){

map.setView(
[
data[0].lat,
data[0].lon
],
14
);



}

});


}

});


</script>

</body>
</html>
